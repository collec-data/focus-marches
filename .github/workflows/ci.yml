name: Build app

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: ["main","develop"]
    # Publish semver tags as releases.
    tags: [ '*.*.*' ]
  pull_request:
      # The branches below must be a subset of the branches above
      branches: [ "main", "develop" ]

permissions:
  contents: read
  id-token: write
  packages: write


jobs:
  Analyse-code:
    name: Analyse Code
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          upload: true
#          max-allowed-issues: 2147483647


  build-focus :
    uses: ./.github/workflows/build-push-docker.yml
    with:
      context: .
      dockerfile: ./Dockerfile
      image-name: ${{ github.repository_owner }}/focus-marches

  build-python :
    uses: ./.github/workflows/build-push-docker.yml
    with:
      context: batch
      dockerfile: ./batch/Dockerfile
      image-name: ${{ github.repository_owner }}/focus-script
